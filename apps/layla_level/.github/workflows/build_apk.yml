name: Build LAYLA Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Entrar na pasta do Flutter e instalar dependências
        run: |
          cd layla_level
          flutter pub get

      - name: Compilar APK Release
        run: |
          cd layla_level
          flutter build apk --release

      - name: Salvar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: layla-app-release
          path: layla_level/build/app/outputs/flutter-apk/app-release.apk