name: Build LAYLA Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Locate Flutter Project and Build APK
        run: |
          FLUTTER_DIR=$(find . -maxdepth 3 -name "pubspec.yaml" -exec dirname {} \;)
          echo "Flutter project found at: $FLUTTER_DIR"
          cd "$FLUTTER_DIR"
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: layla-app-release
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
