    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--porcelain);
      background-image: radial-gradient(at 50% 0%, rgba(31, 92, 158, 0.05) 0px, transparent 60%);
      color: var(--text-main);
      font-family: 'EB Garamond', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 30px;
    }

    /* ===== AZULEJO DADO BORDERS ===== */
    .azulejo-strip {
      width: 100%;
      height: 26px;
      background-image: var(--tile-c);
      background-size: 52px 52px;
      background-repeat: repeat-x;
      background-position: center;
      box-shadow: 0 1px 0 rgba(10,17,41,0.15), 0 -1px 0 rgba(10,17,41,0.15);
      flex-shrink: 0;
    }

    /* ===== HEADER ===== */
    header {
      width: 100%;
      max-width: 600px;
      padding: 26px 20px 18px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .brand-mark img {
      height: 68px;
      width: auto;
      display: block;
    }

    /* ===== NAV TABS ===== */
    .nav-tabs {
      display: flex;
      gap: 6px;
      background: var(--porcelain-alt);
      padding: 5px;
      border-radius: 12px;
      border: 1px solid var(--line);
      margin: 16px auto 4px;
      width: calc(100% - 40px);
      max-width: 560px;
    }

    .nav-btn {
      flex: 1;
      padding: 11px 6px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 13px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-btn.active {
      background: var(--navy);
      color: var(--porcelain);
      font-weight: 600;
      box-shadow: 0 3px 10px rgba(10,17,41,0.25);
    }

    .container {
      width: 100%;
      max-width: 560px;
      padding: 20px 20px 0;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .tab-content { display: none; flex-direction: column; gap: 18px; }
    .tab-content.active { display: flex; }

    /* ===== CARD ===== */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 6px 18px rgba(23, 26, 36, 0.06);
    }

    .card h3 {
      font-family: 'Cinzel', serif;
      font-weight: 600;
      color: var(--navy);
    }

    /* ===== BUBBLE LEVEL — double-ring medallion ===== */
    .level-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 22px 20px 26px;
      position: relative;
    }

    .medallion-frame {
      width: 254px;
      height: 254px;
      border-radius: 50%;
      border: 1.5px solid var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      position: relative;
    }

    .target-circle {
      width: 236px;
      height: 236px;
      border-radius: 50%;
      border: 3px solid var(--navy);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--porcelain);
      background-image: var(--tile-b);
      background-size: 236px 236px;
      background-position: center;
      overflow: hidden;
      box-shadow: inset 0 0 0 6px var(--card-bg);
    }

    .target-circle::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(251,249,243,0.94) 0%, rgba(251,249,243,0.86) 55%, rgba(251,249,243,0.55) 100%);
    }

    .crosshair-h, .crosshair-v {
      position: absolute;
      background: rgba(16, 28, 56, 0.15);
      z-index: 1;
    }
    .crosshair-h { width: 100%; height: 1px; }
    .crosshair-v { height: 100%; width: 1px; }

    .tolerance-zone {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1.5px dashed var(--gold);
      position: absolute;
      z-index: 1;
      transition: border-color 0.3s;
    }

    .bubble {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, var(--azulejo-light), var(--azulejo));
      position: absolute;
      z-index: 2;
      box-shadow: 0 0 12px rgba(31, 92, 158, 0.5), 0 2px 4px rgba(10,17,41,0.3);
      transition: transform 0.08s ease-out, background 0.3s, box-shadow 0.3s;
      transform: translate(0, 0);
    }

    .timer-ring-container {
      position: absolute;
      width: 254px;
      height: 254px;
      pointer-events: none;
    }
    .timer-ring-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .timer-ring-bg { stroke: rgba(16,28,56,0.08); stroke-width: 3; fill: none; }
    .timer-ring-progress {
      stroke: var(--gold);
      stroke-width: 3;
      stroke-linecap: round;
      fill: none;
      stroke-dasharray: 785;
      stroke-dashoffset: 785;
      transition: stroke-dashoffset 0.1s linear, stroke 0.3s;
    }

    /* ===== ANGLE READINGS ===== */
    .angles-display {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      width: 100%;
      gap: 10px;
      text-align: center;
    }

    .angle-box {
      background: var(--porcelain-alt);
      border: 1px solid var(--line);
      padding: 12px 8px;
      border-radius: 10px;
    }

    .angle-label {
      font-family: 'Cinzel', serif;
      font-size: 9px;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .angle-val {
      font-family: 'Inter', sans-serif;
      font-size: 19px;
      font-weight: 700;
      color: var(--navy);
    }

    /* ===== STATUS BADGE ===== */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px;
      border-radius: 30px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      background: var(--warning-bg);
      color: var(--warning);
      border: 1px solid #e3cd9c;
      margin-bottom: 14px;
      transition: all 0.3s;
    }

    .status-badge.perfect {
      background: var(--success-bg);
      color: var(--success);
      border-color: #b9d4b3;
    }

    /* ===== BUTTONS ===== */
    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      transition: all 0.2s;
      letter-spacing: 0.2px;
    }

    .btn-primary {
      background: var(--navy);
      color: var(--porcelain);
      box-shadow: 0 4px 12px rgba(10,17,41,0.25);
    }
    .btn-primary:active { transform: scale(0.98); }

    .btn-success {
      background: var(--success);
      color: white;
      box-shadow: 0 4px 12px rgba(63,125,82,0.3);
      display: none;
    }

    .btn-secondary {
      background: var(--card-bg);
      color: var(--navy);
      border: 1px solid var(--line);
    }

    .btn-outline {
      background: transparent;
      color: var(--azulejo);
      border: 1px solid var(--azulejo-light);
    }

    /* ===== FOLDERS TAB ===== */
    .folder-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .folder-list { display: flex; flex-direction: column; gap: 12px; }

    .folder-item {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-left: 4px solid var(--azulejo);
      border-radius: 10px;
      padding: 15px 16px;
      transition: background 0.2s;
    }

    .folder-info { display: flex; align-items: center; gap: 14px; cursor: pointer; flex: 1; min-width: 0; }

    .folder-icon {
      width: 40px;
      height: 40px;
      border-radius: 9px;
      background: var(--azulejo-pale);
      color: var(--azulejo);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .folder-info h4 { font-family: 'EB Garamond', serif; font-weight: 600; font-size: 16px; }

    .folder-row-top { display: flex; align-items: center; gap: 10px; }

    .folder-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

    .icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--porcelain);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .icon-btn:hover { border-color: var(--azulejo); color: var(--azulejo); }
    .icon-btn.danger:hover { border-color: var(--danger); color: var(--danger); background: var(--danger-bg); }

    .measurements-list { display: flex; flex-direction: column; gap: 9px; margin-top: 14px; }

    .meas-card {
      background: var(--porcelain-alt);
      border-left: 3px solid var(--success);
      border-radius: 7px;
      padding: 11px 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Inter', sans-serif;
      gap: 10px;
    }

    .meas-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10, 17, 41, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 20px 50px rgba(10,17,41,0.35);
    }

    .modal h3 {
      font-family: 'Cinzel', serif;
      font-size: 16px;
      color: var(--navy);
      font-weight: 600;
    }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-control {
      background: var(--porcelain);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px 12px;
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      outline: none;
    }
    .form-control:focus { border-color: var(--azulejo); }
  </style>

  <div class="container">

    <!-- TAB 1: LIVE LEVEL -->
    <div id="level-tab" class="tab-content active">

      <div class="card level-container">

        <div id="status-badge" class="status-badge">
          <i class="fa-solid fa-arrows-spin"></i> <span id="status-text">Adjusting Position</span>
        </div>

        <div class="medallion-frame">
          <div class="target-circle">
            <div class="crosshair-h"></div>
            <div class="crosshair-v"></div>
            <div class="tolerance-zone"></div>
            <div id="bubble" class="bubble"></div>
          </div>

          <div class="timer-ring-container">
            <svg class="timer-ring-svg" viewBox="0 0 254 254">
              <circle class="timer-ring-bg" cx="127" cy="127" r="125"></circle>
              <circle id="timer-progress" class="timer-ring-progress" cx="127" cy="127" r="125"></circle>
            </svg>
          </div>
        </div>

        <div class="angles-display">
          <div class="angle-box">
            <div class="angle-label">Tilt (X)</div>
            <div id="pitch-val" class="angle-val">0.0°</div>
          </div>
          <div class="angle-box">
            <div class="angle-label">Roll (Y)</div>
            <div id="roll-val" class="angle-val">0.0°</div>
          </div>
          <div class="angle-box">
            <div class="angle-label">Total</div>
            <div id="total-val" class="angle-val" style="color: var(--azulejo);">0.0°</div>
          </div>
        </div>

      </div>

      <!-- CONTROLS & ACTION BUTTONS -->
      <div class="card" style="display: flex; flex-direction: column; gap: 12px;">
        <button id="btn-sensor-perm" class="btn btn-secondary" onclick="requestSensorPermission()">
          <i class="fa-solid fa-mobile-screen"></i> Enable Phone Sensors
        </button>

        <button id="btn-save" class="btn btn-success" onclick="openSaveModal()">
          <i class="fa-solid fa-floppy-disk"></i> Save Validated Measurement
        </button>
      </div>

    </div>

    <!-- TAB 2: FOLDERS & STORAGE -->
    <div id="folders-tab" class="tab-content">

      <div class="card">
        <div class="folder-header">
          <h3 style="font-size: 15px;">Site Manager</h3>
          <button class="btn btn-primary" style="width: auto; padding: 8px 14px; font-size: 13px;" onclick="openNewFolderModal()">
            <i class="fa-solid fa-plus"></i> New Folder
          </button>
        </div>
      </div>

      <div id="folder-list-container" class="folder-list"></div>

    </div>

  </div>

  <div class="azulejo-strip" aria-hidden="true" style="margin-top: 26px;"></div>

  <!-- MODAL: SAVE MEASUREMENT -->
  <div id="save-modal" class="modal-overlay">
    <div class="modal">
      <h3><i class="fa-solid fa-square-check" style="color: var(--success);"></i> Save Validated Measurement</h3>

      <div class="form-group">
        <label>Target Folder</label>
        <select id="modal-folder-select" class="form-control" onchange="toggleNewFolderInline()"></select>
      </div>

      <div class="form-group" id="new-folder-inline-group" style="display: none;">
        <label>New Folder Name</label>
        <input type="text" id="modal-new-folder-name" class="form-control" placeholder="e.g. Warehouse B - Solar Panel">
      </div>

      <div class="form-group">
        <label>Measured Angle</label>
        <input type="text" id="modal-angle-val" class="form-control" readonly style="font-weight: bold; color: var(--azulejo);">
      </div>

      <div class="form-group">
        <label>Measurement Point / Label</label>
        <input type="text" id="modal-point-name" class="form-control" placeholder="e.g. Top Right Corner, Ramp A...">
      </div>

      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button class="btn btn-secondary" onclick="closeModal('save-modal')">Cancel</button>
        <button class="btn btn-primary" onclick="confirmSaveMeasurement()">Confirm & Save</button>
      </div>
    </div>
  </div>

  <!-- MODAL: NEW FOLDER -->
  <div id="new-folder-modal" class="modal-overlay">
    <div class="modal">
      <h3><i class="fa-solid fa-folder-plus" style="color: var(--azulejo);"></i> Create New Site Folder</h3>

      <div class="form-group">
        <label>Site / Project Name</label>
        <input type="text" id="new-folder-name" class="form-control" placeholder="e.g. Kitchen Renovation - Client John">
      </div>

      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button class="btn btn-secondary" onclick="closeModal('new-folder-modal')">Cancel</button>
        <button class="btn btn-primary" onclick="confirmCreateFolder()">Create Folder</button>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       APP STATE & LOCAL STORAGE INITIALIZATION
       ========================================================================== */
    const TOLERANCE = 0.3;
    const TIMER_DURATION = 10;

    let currentPitch = 0.0;
    let currentRoll = 0.0;
    let isLevelValid = false;
    let stabilityTimer = 0;
    let timerInterval = null;
    let audioCtx = null;

    let folders = JSON.parse(localStorage.getItem('nd_folders')) || [
      { id: 'f1', name: 'Residential Site - Kitchen', measurements: [
        { id: 'm1', point: 'Main Countertop', angle: '0.05°', date: 'Today, 14:30' },
        { id: 'm2', point: 'Granite Counter', angle: '0.12°', date: 'Today, 14:32' }
      ]},
      { id: 'f2', name: 'Warehouse B - North Ramp', measurements: [] },
      { id: 'f3', name: 'Solar Panel Installation', measurements: [] }
    ];

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');

      if (tabId === 'folders-tab') {
        renderFoldersUI();
      }
    }

    function playSound(type) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'tick') {
          osc.frequency.setValueAtTime(600, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.08);
        } else if (type === 'success') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
          osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
          osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.5);

          if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        }
      } catch (e) {
        console.log('Audio Context error', e);
      }
    }

    function updateEngine(pitch, roll) {
      currentPitch = pitch;
      currentRoll = roll;

      const totalAngle = Math.sqrt(pitch * pitch + roll * roll);

      const pitchEl = document.getElementById('pitch-val');
      const rollEl = document.getElementById('roll-val');
      const totalEl = document.getElementById('total-val');
      const bubbleEl = document.getElementById('bubble');
      const statusBadge = document.getElementById('status-badge');
      const statusText = document.getElementById('status-text');
      const btnSave = document.getElementById('btn-save');

      pitchEl.textContent = `${pitch.toFixed(1)}°`;
      rollEl.textContent = `${roll.toFixed(1)}°`;
      totalEl.textContent = `${totalAngle.toFixed(1)}°`;

      const scale = 8;
      const offsetX = Math.max(-90, Math.min(90, roll * scale));
      const offsetY = Math.max(-90, Math.min(90, pitch * scale));
      bubbleEl.style.transform = `translate(${offsetX}px, ${offsetY}px)`;

      const inRange = totalAngle <= TOLERANCE;

      if (inRange) {
        if (!timerInterval) {
          startStabilityTimer();
        }
      } else {
        resetStabilityTimer();
        statusBadge.className = 'status-badge';
        statusText.textContent = 'Adjusting Position...';
        btnSave.style.display = 'none';
        bubbleEl.style.background = 'radial-gradient(circle at 35% 35%, #d9a13a, #b9791c)';
      }
    }

    function startStabilityTimer() {
      stabilityTimer = 0;
      const statusBadge = document.getElementById('status-badge');
      const statusText = document.getElementById('status-text');
      const progressCircle = document.getElementById('timer-progress');
      const bubbleEl = document.getElementById('bubble');

      timerInterval = setInterval(() => {
        stabilityTimer += 0.1;
        const progressPct = Math.min(1, stabilityTimer / TIMER_DURATION);

        const circleLength = 785;
        const offset = circleLength - (progressPct * circleLength);
        progressCircle.style.strokeDashoffset = offset;

        statusBadge.className = 'status-badge';
        statusText.textContent = `Stabilizing: ${(TIMER_DURATION - stabilityTimer).toFixed(1)}s`;

        if (Math.floor(stabilityTimer * 10) % 10 === 0 && stabilityTimer < TIMER_DURATION) {
          playSound('tick');
        }

        if (stabilityTimer >= TIMER_DURATION) {
          clearInterval(timerInterval);
          timerInterval = null;
          isLevelValid = true;

          statusBadge.className = 'status-badge perfect';
          statusText.textContent = 'Level Validated (10s OK)';
          document.getElementById('btn-save').style.display = 'flex';
          bubbleEl.style.background = 'radial-gradient(circle at 35% 35%, #5a9a71, #3f7d52)';

          playSound('success');
        }
      }, 100);
    }

    function resetStabilityTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      stabilityTimer = 0;
      isLevelValid = false;
      document.getElementById('timer-progress').style.strokeDashoffset = 785;
    }

    function requestSensorPermission() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(permissionState => {
            if (permissionState === 'granted') {
              enableRealSensors();
            } else {
              alert('Gyroscope/accelerometer permission denied.');
            }
          })
          .catch(console.error);
      } else if (window.DeviceOrientationEvent) {
        enableRealSensors();
      } else {
        alert('Your browser does not support orientation sensors.');
      }
    }

    function enableRealSensors() {
      document.getElementById('btn-sensor-perm').style.display = 'none';
      window.addEventListener('deviceorientation', handleOrientation);
    }

    function handleOrientation(event) {
      const pitch = event.beta || 0;
      const roll = event.gamma || 0;
      updateEngine(pitch, roll);
    }

    /* ==========================================================================
       FOLDER & STORAGE MANAGEMENT (LOCALSTORAGE)
       ========================================================================== */
    function saveFoldersToStorage() {
      localStorage.setItem('nd_folders', JSON.stringify(folders));
      updateModalFolderDropdown();
      document.getElementById('folder-count').textContent = folders.length;
    }

    function updateModalFolderDropdown() {
      const modalSelect = document.getElementById('modal-folder-select');
      modalSelect.innerHTML = '';

      folders.forEach(f => {
        const opt = document.createElement('option');
        opt.value = f.id;
        opt.textContent = f.name;
        modalSelect.appendChild(opt);
      });

      const newOpt = document.createElement('option');
      newOpt.value = '__new__';
      newOpt.textContent = '+ Create New Folder...';
      modalSelect.appendChild(newOpt);
    }

    function toggleNewFolderInline() {
      const select = document.getElementById('modal-folder-select');
      const group = document.getElementById('new-folder-inline-group');
      group.style.display = select.value === '__new__' ? 'flex' : 'none';
    }

    function renderFoldersUI() {
      const container = document.getElementById('folder-list-container');
      container.innerHTML = '';

      folders.forEach(folder => {
        const item = document.createElement('div');
        item.className = 'folder-item';

        const measHtml = folder.measurements.map(m => `
          <div class="meas-card">
            <div>
              <strong style="font-size: 14px; color: var(--text-main); font-family: 'EB Garamond', serif;">${m.point}</strong>
              <div style="font-size: 11px; color: var(--text-muted);">${m.date}</div>
            </div>
            <div class="meas-actions">
              <span style="font-weight: 700; color: var(--success); font-size: 15px;">${m.angle}</span>
              <button class="icon-btn danger" title="Delete measurement" onclick="event.stopPropagation(); deleteMeasurement('${folder.id}','${m.id}')"><i class="fa-solid fa-xmark"></i></button>
            </div>
          </div>
        `).join('');

        item.innerHTML = `
          <div style="width: 100%;">
            <div class="folder-row-top">
              <div class="folder-info" onclick="toggleFolderExpand('${folder.id}')">
                <div class="folder-icon"><i class="fa-solid fa-folder-closed"></i></div>
                <div style="flex: 1; min-width: 0;">
                  <h4>${folder.name}</h4>
                  <p style="font-family: 'Inter', sans-serif; font-size: 12px; color: var(--text-muted); margin-top: 2px;">
                    ${folder.measurements.length} measurement(s) saved
                  </p>
                </div>
              </div>
              <div class="folder-actions">
                <button class="icon-btn" title="Generate PDF report" onclick="event.stopPropagation(); generatePDFReport('${folder.id}')"><i class="fa-solid fa-file-pdf"></i></button>
                <button class="icon-btn danger" title="Delete folder" onclick="event.stopPropagation(); deleteFolder('${folder.id}')"><i class="fa-solid fa-trash"></i></button>
                <button class="icon-btn" title="Expand" onclick="toggleFolderExpand('${folder.id}')"><i class="fa-solid fa-chevron-down"></i></button>
              </div>
            </div>

            <div id="meas-list-${folder.id}" class="measurements-list" style="display: none;">
              ${measHtml || '<div style="font-size: 12px; color: var(--text-muted); text-align: center; padding: 10px; font-family: \'Inter\', sans-serif;">No measurements in this folder yet.</div>'}
            </div>
          </div>
        `;

        container.appendChild(item);
      });
    }

    function toggleFolderExpand(folderId) {
      const el = document.getElementById(`meas-list-${folderId}`);
      if (el) {
        el.style.display = el.style.display === 'none' ? 'flex' : 'none';
      }
    }

    function deleteFolder(folderId) {
      const folder = folders.find(f => f.id === folderId);
      if (!folder) return;
      const ok = confirm(`Delete "${folder.name}" and all its measurements? This cannot be undone.`);
      if (!ok) return;
      folders = folders.filter(f => f.id !== folderId);
      saveFoldersToStorage();
      renderFoldersUI();
    }

    function deleteMeasurement(folderId, measId) {
      const folder = folders.find(f => f.id === folderId);
      if (!folder) return;
      const ok = confirm('Delete this measurement?');
      if (!ok) return;
      folder.measurements = folder.measurements.filter(m => m.id !== measId);
      saveFoldersToStorage();
      renderFoldersUI();
    }

    /* ==========================================================================
       MODALS & SAVE LOGIC
       ========================================================================== */
    function openSaveModal() {
      const totalAngle = Math.sqrt(currentPitch * currentPitch + currentRoll * currentRoll);
      document.getElementById('modal-angle-val').value = `${totalAngle.toFixed(2)}° (Pitch: ${currentPitch.toFixed(1)}°, Roll: ${currentRoll.toFixed(1)}°)`;
      document.getElementById('modal-point-name').value = '';
      document.getElementById('modal-new-folder-name').value = '';
      document.getElementById('new-folder-inline-group').style.display = 'none';

      document.getElementById('save-modal').style.display = 'flex';
    }

    function openNewFolderModal() {
      document.getElementById('new-folder-name').value = '';
      document.getElementById('new-folder-modal').style.display = 'flex';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function confirmSaveMeasurement() {
      let folderId = document.getElementById('modal-folder-select').value;
      const pointName = document.getElementById('modal-point-name').value.trim() || 'Unnamed Point';
      const totalAngle = Math.sqrt(currentPitch * currentPitch + currentRoll * currentRoll);

      if (folderId === '__new__') {
        const newName = document.getElementById('modal-new-folder-name').value.trim();
        if (!newName) { alert('Please enter a name for the new folder.'); return; }
        const newFolder = { id: 'f_' + Date.now(), name: newName, measurements: [] };
        folders.push(newFolder);
        folderId = newFolder.id;
      }

      const folder = folders.find(f => f.id === folderId);
      if (folder) {
        folder.measurements.unshift({
          id: 'm_' + Date.now(),
          point: pointName,
          angle: `${totalAngle.toFixed(2)}°`,
          date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });

        saveFoldersToStorage();
        closeModal('save-modal');
        alert('Measurement saved successfully!');
      }
    }

    function confirmCreateFolder() {
      const name = document.getElementById('new-folder-name').value.trim();
      if (!name) return alert('Please enter a name for the folder.');

      folders.push({
        id: 'f_' + Date.now(),
        name: name,
        measurements: []
      });

      saveFoldersToStorage();
      closeModal('new-folder-modal');
      renderFoldersUI();
    }

    /* ==========================================================================
       PDF TECHNICAL REPORT
       ========================================================================== */
    function generatePDFReport(folderId) {
      const folder = folders.find(f => f.id === folderId);
      if (!folder) return;

      if (!window.jspdf) {
        alert('PDF library failed to load. Check your internet connection and try again.');
        return;
      }

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const pageWidth = doc.internal.pageSize.getWidth();
      const pageHeight = doc.internal.pageSize.getHeight();
      const logoImg = document.getElementById('brand-logo');

      try {
        doc.addImage(logoImg.src, 'PNG', 15, 12, 30, 21.2);
      } catch (e) {
        console.log('Logo embed skipped:', e);
      }

      doc.setFont('helvetica', 'bold');
      doc.setFontSize(16);
      doc.setTextColor(16, 28, 56);
      doc.text('Technical Inclination Report', pageWidth - 15, 20, { align: 'right' });

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(10);
      doc.setTextColor(107, 100, 86);
      doc.text(`Site / Project: ${folder.name}`, pageWidth - 15, 27, { align: 'right' });
      doc.text(`Generated: ${new Date().toLocaleString()}`, pageWidth - 15, 32, { align: 'right' });

      doc.setDrawColor(221, 209, 174);
      doc.line(15, 40, pageWidth - 15, 40);

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9);
      doc.setTextColor(107, 100, 86);
      doc.text(`Validation method: continuous stability lock, tolerance ${TOLERANCE}\u00b0, hold time ${TIMER_DURATION}s.`, 15, 47);

      let y = 58;
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(11);
      doc.setTextColor(16, 28, 56);
      doc.text('Point', 15, y);
      doc.text('Angle', 120, y);
      doc.text('Timestamp', 160, y);
      y += 4;
      doc.setDrawColor(31, 92, 158);
      doc.setLineWidth(0.6);
      doc.line(15, y, pageWidth - 15, y);
      y += 8;

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(10);
      doc.setTextColor(23, 26, 36);
      doc.setLineWidth(0.2);

      if (folder.measurements.length === 0) {
        doc.setTextColor(107, 100, 86);
        doc.text('No measurements recorded in this folder.', 15, y);
        y += 8;
      } else {
        folder.measurements.forEach(m => {
          if (y > 270) {
            doc.addPage();
            y = 20;
          }
          doc.setTextColor(23, 26, 36);
          doc.text(String(m.point), 15, y, { maxWidth: 100 });
          doc.text(String(m.angle), 120, y);
          doc.text(String(m.date), 160, y);
          doc.setDrawColor(221, 209, 174);
          doc.line(15, y + 3, pageWidth - 15, y + 3);
          y += 10;
        });
      }

      const pageCount = doc.internal.getNumberOfPages();
      for (let i = 1; i <= pageCount; i++) {
        doc.setPage(i);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(8);
        doc.setTextColor(150, 145, 130);
        doc.text('Generated by LAYLA Digital Inclinometer.', 15, pageHeight - 12);
        doc.text(`Page ${i} of ${pageCount}`, pageWidth - 15, pageHeight - 12, { align: 'right' });
      }

      const safeName = folder.name.replace(/[^a-z0-9]+/gi, '_');
      doc.save(`LAYLA_Report_${safeName}.pdf`);
    }

    /* ==========================================================================
       APP INIT
       ========================================================================== */
    window.addEventListener('load', () => {
      saveFoldersToStorage();
      updateEngine(0, 0);
    });
  </script>
</body>
</html>
